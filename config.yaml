# Pipeline configuré le 2026-11-06 (secrets Google + Gemini + Base_Profil partagée)
# Configuration du module 1 — Sourcing

scoring:
  threshold: 4            # score minimum pour garder une offre
  title_multiplier: 3     # un mot-clé dans le titre pèse 3x plus
  positive:               # mot-clé : poids
    instrumentiste: 5
    instrumentation: 5
    automaticien: 5
    automatisme: 4
    métrologue: 4
    métrologie: 3
    électromécanicien: 4
    électromécanique: 3
    maintenance: 2
    régulation: 3
    électricien: 2
    électrotechnicien: 3
    plc: 3
    api: 1
    siemens: 2
    schneider: 2
    scada: 3
    capteur: 2
    variateur: 2
    process: 1
    technicien: 1
  negative:
    commercial: -4
    vendeur: -4
    comptable: -5
    chauffeur: -5
    caissier: -5
    assistant(e) commercial: -5
    marketing: -4
    rh: -2

max_details_per_run: 40   # fiches détaillées téléchargées par run (politesse + minutes)
delay_seconds: 2

# Zone géographique (modifiable dans l'onglet Parametres, clé « zone_recherche », liste séparée par des virgules).
# Une offre dont le lieu est connu et ne contient aucune de ces localités est écartée ;
# un lieu inconnu ou seulement « Côte d'Ivoire » est vérifié ensuite par l'IA dans le texte de l'offre.
lieux_cibles: ["abidjan", "cocody", "plateau", "yopougon", "marcory", "treichville", "koumassi",
  "port-bouët", "port-bouet", "abobo", "adjamé", "adjame", "attécoubé", "attecoube", "riviera",
  "angré", "angre", "zone 4", "vridi", "bingerville", "anyama", "songon", "brofodoumé"]
lieux_ambigus: ["côte d'ivoire", "cote d'ivoire", "côte d’ivoire", "cote d’ivoire", "ivory coast", "ci"]

sources:
  jobivoire:
    enabled: true
    url: https://jobivoire.ci/jobs
    pages: 3              # pages de liste parcourues (?page=N)
  educarriere:
    enabled: true
    url: https://emploi.educarriere.ci/page/all
    pages: 3
  novojob:
    enabled: true
    rss: https://www.novojob.com/cote-d-ivoire/rss
  email_alerts:           # Emploi.ci (bloqué Cloudflare) + LinkedIn via alertes Gmail
    enabled: true
    imap_folder: jobs-alerts
    senders: ["emploi.ci", "linkedin.com", "educarriere.ci", "novojob.com"]
    since_days: 2

# Configuration du module 2 — Génération (les valeurs de l'onglet Parametres du Sheets sont prioritaires)
generation:
  seuil: 4                      # score minimum pour générer automatiquement
  max_par_run: 12               # candidatures préparées par run (quota IA gratuit)
  pause_s: 5
  budget_minutes: 25            # temps max de génération par run (le reste passe au run suivant)
  gemini_models: ["gemini-flash-latest", "gemini-flash-lite-latest"]   # 2.5-flash : fermé aux nouveaux comptes
  groq_model: "openai/gpt-oss-120b"
  dossier_cv: "1tnZHfVizLl4hNa7MS7jeRZJZJmf5IgCO"   # Drive : Pipeline Emploi/Base_Profil/CV
  dossier_lm: "1zqFB3JenZ4WonfF5eWY-KyHGBHaj8fm9"   # Drive : Pipeline Emploi/Base_Profil/LM
  portfolio_url: "https://portfolio.cedrictiene.tech"   # relu chaque semaine, ajouté à la Base profil
